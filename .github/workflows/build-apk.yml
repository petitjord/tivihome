name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            # Remonte les erreurs en annotations lisibles sur la page du build
            grep -vE "^> Task" build.log | grep -E "^e: |error:|Could not|Unresolved|wrong:|^> [A-Z]" -A1 | grep -vE "^--$" | head -9 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          }

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Tivihome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tivihome
          path: Tivihome.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tivihome 1.0.${{ github.run_number }}
          body: |
            APK à installer sur Android TV : télécharge **Tivihome.apk** ci-dessous.
          files: Tivihome.apk
          make_latest: true
